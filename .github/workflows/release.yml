name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  build-and-release:
    name: Build and Release (${{ matrix.os }})
    needs: changelog
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: loom-engine-linux-amd64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: loom-engine-windows-amd64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: loom-engine-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: loom-engine-macos-amd64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p release_pkg
          cp target/${{ matrix.target }}/release/loom-engine release_pkg/
          cp -r configs release_pkg/
          tar -czvf ${{ matrix.asset_name }} -C release_pkg .

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_pkg
          Copy-Item target/${{ matrix.target }}/release/loom-engine.exe release_pkg/
          Copy-Item -Path configs -Destination release_pkg/ -Recurse
          Compress-Archive -Path release_pkg/* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: false